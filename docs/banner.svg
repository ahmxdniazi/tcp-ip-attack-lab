<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#0a0e1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="60%" style="stop-color:#e2e8f0"/>
      <stop offset="100%" style="stop-color:#94a3b8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="redglow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="25" x2="900" y2="25"/>
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="75" x2="900" y2="75"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="125" x2="900" y2="125"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="175" x2="900" y2="175"/>
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="250" y1="0" x2="250" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="350" y1="0" x2="350" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="550" y1="0" x2="550" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="650" y1="0" x2="650" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
    <line x1="850" y1="0" x2="850" y2="200"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="200" fill="url(#accent)"/>

  <!-- Red glow orb left -->
  <circle cx="80" cy="100" r="60" fill="#dc2626" opacity="0.06"/>
  <circle cx="80" cy="100" r="30" fill="#dc2626" opacity="0.08"/>

  <!-- Right side decorative -->
  <circle cx="820" cy="100" r="80" fill="#1e40af" opacity="0.05"/>

  <!-- Shield icon (simplified) -->
  <g transform="translate(52, 68)" filter="url(#redglow)">
    <path d="M28 0 L56 12 L56 36 C56 52 28 64 28 64 C28 64 0 52 0 36 L0 12 Z"
          fill="none" stroke="#dc2626" stroke-width="2" opacity="0.9"/>
    <path d="M28 8 L50 18 L50 36 C50 48 28 58 28 58 C28 58 6 48 6 36 L6 18 Z"
          fill="#dc2626" opacity="0.15"/>
    <!-- Lock symbol inside shield -->
    <rect x="20" y="32" width="16" height="12" rx="2" fill="#ef4444" opacity="0.8"/>
    <path d="M22 32 L22 27 C22 22 34 22 34 27 L34 32" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.8"/>
    <circle cx="28" cy="38" r="2" fill="#0a0e1a"/>
  </g>

  <!-- Main title -->
  <text x="135" y="85" font-family="'Courier New', monospace" font-size="38" font-weight="700"
        fill="url(#titleGrad)" letter-spacing="2" filter="url(#glow)">
    TCP/IP ATTACK LAB
  </text>

  <!-- Red underline accent -->
  <rect x="135" y="94" width="420" height="2" fill="url(#accent)" opacity="0.8"/>

  <!-- Subtitle -->
  <text x="136" y="120" font-family="'Courier New', monospace" font-size="13"
        fill="#64748b" letter-spacing="3">
    APPLIED NETWORK SECURITY  ·  FAST–NUCES ISLAMABAD
  </text>

  <!-- Tags row -->
  <!-- SYN Flood tag -->
  <rect x="135" y="140" width="100" height="22" rx="3" fill="#7f1d1d" opacity="0.6"/>
  <text x="185" y="155" font-family="'Courier New', monospace" font-size="10"
        fill="#fca5a5" text-anchor="middle" font-weight="bold">SYN FLOOD</text>

  <!-- RST Attack tag -->
  <rect x="244" y="140" width="100" height="22" rx="3" fill="#7f1d1d" opacity="0.6"/>
  <text x="294" y="155" font-family="'Courier New', monospace" font-size="10"
        fill="#fca5a5" text-anchor="middle" font-weight="bold">RST ATTACK</text>

  <!-- Hijacking tag -->
  <rect x="353" y="140" width="120" height="22" rx="3" fill="#1e3a5f" opacity="0.7"/>
  <text x="413" y="155" font-family="'Courier New', monospace" font-size="10"
        fill="#93c5fd" text-anchor="middle" font-weight="bold">SESSION HIJACK</text>

  <!-- Reverse Shell tag -->
  <rect x="482" y="140" width="120" height="22" rx="3" fill="#14532d" opacity="0.6"/>
  <text x="542" y="155" font-family="'Courier New', monospace" font-size="10"
        fill="#86efac" text-anchor="middle" font-weight="bold">REVERSE SHELL</text>

  <!-- Scapy tag -->
  <rect x="611" y="140" width="70" height="22" rx="3" fill="#312e81" opacity="0.6"/>
  <text x="646" y="155" font-family="'Courier New', monospace" font-size="10"
        fill="#c7d2fe" text-anchor="middle" font-weight="bold">SCAPY</text>

  <!-- Right side network packet animation hint -->
  <g opacity="0.5">
    <!-- Packet 1 -->
    <rect x="760" y="75" width="40" height="18" rx="2" fill="none" stroke="#dc2626" stroke-width="1"/>
    <text x="780" y="88" font-family="'Courier New', monospace" font-size="8" fill="#dc2626" text-anchor="middle">SYN</text>
    <!-- Arrow -->
    <line x1="800" y1="84" x2="830" y2="84" stroke="#dc2626" stroke-width="1"/>
    <polygon points="830,80 840,84 830,88" fill="#dc2626"/>

    <!-- Packet 2 -->
    <rect x="760" y="105" width="60" height="18" rx="2" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <text x="790" y="118" font-family="'Courier New', monospace" font-size="8" fill="#3b82f6" text-anchor="middle">SYN-ACK</text>

    <!-- Packet 3 (RST) -->
    <rect x="760" y="135" width="40" height="18" rx="2" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <text x="780" y="148" font-family="'Courier New', monospace" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="bold">RST</text>
  </g>

  <!-- Bottom status line -->
  <text x="135" y="185" font-family="'Courier New', monospace" font-size="10"
        fill="#334155" letter-spacing="1">
    [4 TASKS]  [PYTHON + C]  [WIRESHARK]  [SCAPY]  [RAW SOCKETS]  [CONTROLLED ENV]
  </text>

  <!-- Top right label -->
  <text x="870" y="25" font-family="'Courier New', monospace" font-size="10"
        fill="#475569" text-anchor="end">25I-7705</text>
</svg>
